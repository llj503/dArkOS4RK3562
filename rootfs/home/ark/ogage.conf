# dArkOS3562 ogage 热键配置 (rk3562 全机型)
# 热键: FN(HAPPY1) / SELECT / HOME(MODE) 任一按住 + 方向键
HOTKEY=BTN_TRIGGER_HAPPY1
HOTKEY2=BTN_SELECT
HOTKEY3=BTN_MODE
# 亮度调节
BRIGHT_UP=BTN_DPAD_UP
BRIGHT_DOWN=BTN_DPAD_DOWN
# 音量调节 (热键组合)
VOL_UP=BTN_DPAD_RIGHT
VOL_DOWN=BTN_DPAD_LEFT
# 系统音量按键 (裸按)
VOLUME_UP=KEY_VOLUMEUP
VOLUME_DOWN=KEY_VOLUMEDOWN
MUTE=KEY_PLAYPAUSE
VOLUME_CONTROL=Master
