# dArkOS3562 ogage 热键配置
# HOTKEY 由 hook.sh 按机型 (console_detect 的 HOTKEY_TYPE) 写入:
#   mode -> BTN_MODE, select -> BTN_SELECT, happy5 -> BTN_TRIGGER_HAPPY5
# ES 的"输入控制 -> 全局快捷键"页会改写下面这些键, 每一项都可以是
# BTN_* 按键, 或者 RSTICK_UP/DOWN/LEFT/RIGHT、LSTICK_* 摇杆方向.
HOTKEY=BTN_MODE

# 亮度 / 音量 / 风扇 (HOTKEY + 触发)
BRIGHT_UP=BTN_DPAD_UP
BRIGHT_DOWN=BTN_DPAD_DOWN
VOL_UP=BTN_DPAD_RIGHT
VOL_DOWN=BTN_DPAD_LEFT
FAN_TOGGLE_KEY=BTN_START

# 摇杆方向阈值 (满量程 ±32767)
STICK_THRESHOLD=22000
STICK_RELEASE=11000

# 裸按键
VOLUME_UP=KEY_VOLUMEUP
VOLUME_DOWN=KEY_VOLUMEDOWN
# 本机 RK817: Master 只读, 真实音量控件是 DAC
VOLUME_CONTROL=DAC

# 风扇切换 (HOTKEY+START) 是否启用, hook 按机型写
FAN_TOGGLE=yes
