# dArkOS3562 ogage 热键配置 (ArkOS 最小集, 同 arkos4clone)
# HOTKEY 由 hook.sh 按机型 (console_detect 的 HOTKEY_TYPE) 写入一个值:
#   mode -> BTN_MODE, select -> BTN_SELECT, happy5 -> BTN_TRIGGER_HAPPY5
HOTKEY=BTN_MODE
# 亮度调节
BRIGHT_UP=BTN_DPAD_UP
BRIGHT_DOWN=BTN_DPAD_DOWN
# 音量调节 (热键组合)
VOL_UP=BTN_DPAD_RIGHT
VOL_DOWN=BTN_DPAD_LEFT
# 系统音量按键 (裸按)
VOLUME_UP=KEY_VOLUMEUP
VOLUME_DOWN=KEY_VOLUMEDOWN
# 音量控制: 本机 RK817 暴露的是 Master (Playback 是 rk3326 老驱动的名字)
VOLUME_CONTROL=Master
# 风扇切换 (热键+START): hook.sh 按 console_detect 的 FAN 自动写入, 有
# pwm-fan 的机型 (AIS) 为 yes; 每次按住切换 最大(High) <-> 关闭,
# 状态写在 fan.cfg, 与 ES 的 FAN SPEED 同一份配置
#FAN_TOGGLE=yes
