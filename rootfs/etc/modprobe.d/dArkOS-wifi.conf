# Prevent udev SDIO-vendor auto-modprobe of aic8800 at boot.
#
# hook.sh (firstboot.service, every boot) picks by DT transport: SDIO
# machines (rg52mini/rg43h/rg43v, ais) load exactly one of rk915 or the
# aic8800 SDIO stack; USB machines (ngp45ht, xf55h) load the AIC USB and
# ZT9101 drivers, which do not conflict. The SDIO bsp and the USB loader
# export the same symbols (get_adap_test), so the SDIO stack must never be
# loaded on USB machines and vice versa. Both SDIO drivers pulse
# rockchip_wifi_power() at init; concurrent udev autoload while another
# driver is probing stomps firmware download mid-init, leaving wlan0
# missing. Explicit modprobe bypasses this list.
blacklist aic8800_fdrv
blacklist aic8800_bsp