name: dArkOS4RK3562 system images

on:
  workflow_dispatch:
    inputs:
      ngp45ht:
        description: Build NGP45HT system image
        required: false
        type: boolean
        default: true
      pocketais:
        description: Build Pocket AIS system image
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: darkos4rk3562-release
  cancel-in-progress: false

jobs:
  guard:
    name: Validate and prepare draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler mtools dosfstools gdisk

      - name: At least one device selected
        run: |
          if [[ "${{ inputs.ngp45ht }}" != "true" && "${{ inputs.pocketais }}" != "true" ]]; then
            echo "::error::select at least one device"
            exit 1
          fi
          echo "NGP45HT=${{ inputs.ngp45ht }} PocketAIS=${{ inputs.pocketais }}"

      - name: Validate repository
        run: |
          chmod +x build_image.sh scripts/*.sh
          ./scripts/validate.sh

      - name: Create or reuse today's draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          TAG="dArkOS4RK3562-$BUILD_DATE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "dArkOS4RK3562 flashable system images for NGP45HT and Pocket AIS. Each .img.xz is split into <2 GiB parts; concatenate the parts in order and verify with SHA256SUMS-<device>.txt." \
              --draft=true
          fi

      - name: Drop legacy update-package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The release tag is date-based and reused; remove assets from older
          # runs that are not system images (p3 partitions / overlay tars).
          for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            case "$name" in
              DarkOS-*-p3.img|update-darkos-*.tar|SHA256SUMS.txt)
                echo "delete obsolete asset: $name"
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done

  ngp45ht:
    name: NGP45HT system image
    if: inputs.ngp45ht == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools dosfstools xz-utils gdisk rsync

      - name: Build system image
        run: |
          chmod +x build_image.sh scripts/*.sh
          sudo ./build_image.sh ngp45ht --fetch-base \
            --outdir "$GITHUB_WORKSPACE/work" \
            --output "$GITHUB_WORKSPACE/ngp45ht.img"
          ls -lh ngp45ht.img

      - name: Compress, split, checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          DATE=${TAG##*-}
          NAME="dArkOS4RK3562-ngp45ht-${DATE}.img"
          xz -T0 -6 -c ngp45ht.img > "${NAME}.xz"
          rm -f ngp45ht.img
          split -b 1900M -d -a 2 "${NAME}.xz" "${NAME}.xz.part-"
          sha256sum "${NAME}.xz" > "SHA256SUMS-ngp45ht.txt"
          sha256sum "${NAME}.xz".part-* >> "SHA256SUMS-ngp45ht.txt"
          rm -f "${NAME}.xz"
          ls -lh
          cat "SHA256SUMS-ngp45ht.txt"
          gh release upload "$TAG" "${NAME}.xz".part-* "SHA256SUMS-ngp45ht.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber

  pocketais:
    name: Pocket AIS system image
    if: inputs.pocketais == true
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mtools dosfstools xz-utils gdisk rsync

      - name: Build system image
        run: |
          chmod +x build_image.sh scripts/*.sh
          sudo ./build_image.sh pocketais --fetch-base \
            --outdir "$GITHUB_WORKSPACE/work" \
            --output "$GITHUB_WORKSPACE/pocketais.img"
          ls -lh pocketais.img

      - name: Compress, split, checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          DATE=${TAG##*-}
          NAME="dArkOS4RK3562-pocketais-${DATE}.img"
          xz -T0 -6 -c pocketais.img > "${NAME}.xz"
          rm -f pocketais.img
          split -b 1900M -d -a 2 "${NAME}.xz" "${NAME}.xz.part-"
          sha256sum "${NAME}.xz" > "SHA256SUMS-pocketais.txt"
          sha256sum "${NAME}.xz".part-* >> "SHA256SUMS-pocketais.txt"
          rm -f "${NAME}.xz"
          ls -lh
          cat "SHA256SUMS-pocketais.txt"
          gh release upload "$TAG" "${NAME}.xz".part-* "SHA256SUMS-pocketais.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
