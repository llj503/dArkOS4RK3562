name: Build dArkOS4RK3562 artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: darkos4rk3562-release
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.device }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: [ ngp45ht, pocketais ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler mtools dosfstools python3

      - name: Validate
        run: |
          chmod +x scripts/*.sh build_image.sh
          ./scripts/validate.sh

      - name: Build artifacts
        run: |
          ./scripts/build_boot_bundle.sh "${{ matrix.device }}" \
            "out/DarkOS-${{ matrix.device }}-p3.img"
          ./scripts/build_update_tar.sh "${{ matrix.device }}" \
            "out/update-darkos-${{ matrix.device }}.tar"
          (cd out && sha256sum "DarkOS-${{ matrix.device }}-p3.img" \
            "update-darkos-${{ matrix.device }}.tar" \
            > "SHA256SUMS-${{ matrix.device }}.txt")
          cat "out/SHA256SUMS-${{ matrix.device }}.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dArkOS4RK3562-${{ matrix.device }}
          path: |
            out/DarkOS-${{ matrix.device }}-p3.img
            out/update-darkos-${{ matrix.device }}.tar
            out/SHA256SUMS-${{ matrix.device }}.txt
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dArkOS4RK3562-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dArkOS4RK3562-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading with --clobber"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "dArkOS4RK3562 boot bundles and rootfs overlays. Base dArkOS images are not included; see README.md for the NGP45HT and Pocket AIS source images." \
              --draft=false
          fi
          gh release upload "$TAG" dist/* --clobber
